[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "networkforgeai"
version = "0.1.0"
description = "Authorized AI-assisted security validation framework"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.1,<3",
]

[project.optional-dependencies]
runtime = ["fastapi>=0.109", "uvicorn>=0.27"]
llm = ["openai>=1.12", "anthropic>=0.18", "google-genai>=1.0", "litellm>=1.40"]
browser = ["playwright>=1.40"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "build>=1.2",
  "ruff>=0.6",
  "bandit>=1.7",
  "black>=24.0",
  "pip-audit>=2.7",
  "mypy>=1.10",
]

[project.scripts]
networkforgeai = "networkforgeai.cli:main"

[tool.setuptools.packages.find]
include = ["networkforgeai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
  "integration: tests requiring a local service or external binary",
  "live_provider: tests requiring configured LLM credentials",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".python-versions", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".python-versions"]

[tool.coverage.run]
omit = [
    "networkforgeai/cli.py",
    "networkforgeai/interface/dashboard.py",
    "networkforgeai/models/anthropic_adapter.py",
    "networkforgeai/models/google_adapter.py",
    "networkforgeai/models/openai_adapter.py",
]

[tool.coverage.report]
exclude_also = [
    "@abstractmethod",
]
