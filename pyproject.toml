[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networkforgeai"
version = "0.1.0"
description = "Authorized AI-assisted security validation framework"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.1,<3",
]

[project.optional-dependencies]
runtime = ["fastapi>=0.109", "uvicorn>=0.27"]
llm = ["openai>=1.12", "anthropic>=0.18", "google-generativeai>=0.4", "litellm>=1.40"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "lint",
  "bandit>=1.7",
  "black>=24.0",
]

[project.scripts]
networkforgeai = "networkforgeai.cli:main"

[tool.setuptools.packages.find]
include = ["networkforgeai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
