name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime,llm]"
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: python -m pip check
      - run: ruff check networkforgeai tests tools
      - run: ruff format --check networkforgeai tests tools
      - run: python -m mypy --strict networkforgeai
      - run: bandit -q -r networkforgeai -ll
      - run: pip-audit

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime,llm]"
      - run: python -m pytest -q --cov=networkforgeai --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  documentation:
    name: Documentation audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[runtime]"
      - run: python tools/ci_docs_audit.py --json | tee docs-audit.json
      - run: python tools/generate_cli_docs.py --check
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: documentation-audit
          path: docs-audit.json

  findings-policy:
    name: Findings policy gate
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[runtime]"
      - run: python tools/ci_findings_gate.py tests/fixtures/ci-findings-pass.json --json

  container:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose config --quiet
      - run: docker build --tag networkforgeai:ci .
      - run: docker run --rm --read-only networkforgeai:ci python -m networkforgeai.cli --version
      - run: docker run --rm --read-only networkforgeai:ci python -m networkforgeai.cli --help

  integration:
    name: Container integration smoke
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: docker build --tag networkforgeai:integration .
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime]"
      - run: python -m pytest -m integration -q
        env:
          NETWORKFORGE_SANDBOX_IMAGE: networkforgeai:integration

  package-install:
    name: Clean package install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --outdir dist
      - run: python tools/release_provenance.py --output release-provenance.json dist/*.whl
      - run: python -m venv "$RUNNER_TEMP/networkforgeai-venv"
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/python" -m pip install --upgrade pip'
      - run: python -m venv "$RUNNER_TEMP/networkforgeai-audit-venv"
      - run: '"$RUNNER_TEMP/networkforgeai-audit-venv/bin/python" -m pip install --upgrade pip pip-audit'
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/python" -m pip install dist/*.whl'
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/python" -m pip check'
      - run: >-
          "$RUNNER_TEMP/networkforgeai-audit-venv/bin/pip-audit"
          --path "$RUNNER_TEMP/networkforgeai-venv/lib/python3.11/site-packages"
          -f cyclonedx-json -o sbom.json
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --version'
        working-directory: ${{ runner.temp }}
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --help'
        working-directory: ${{ runner.temp }}
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --list-tools'
        working-directory: ${{ runner.temp }}
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --validate-config'
        working-directory: ${{ runner.temp }}
        env:
          TARGET_SCOPE: example.com
          DASHBOARD_AUTH_TOKEN: package-smoke-token
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --target example.com --scope example.com --tool nmap --dry-run'
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: networkforgeai-wheel
          path: |
            dist/*.whl
            sbom.json
            release-provenance.json

  platform-compatibility:
    name: Platform compatibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,runtime]"
      - run: python -m pytest -q tests/test_platform_compatibility.py
      - run: networkforgeai --version

  readiness:
    name: User readiness gate
    needs: [quality, tests, documentation, container, integration, package-install, findings-policy, platform-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime,llm]"
      - run: python -m pip check
      - run: python tools/user_readiness.py --strict --json | tee user-readiness.json
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        if: always()
        with:
          name: user-readiness
          path: user-readiness.json
