name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime,llm]"
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: python -m pip check
      - run: ruff check networkforgeai tests tools
      - run: ruff format --check networkforgeai tests tools
      - run: python -m mypy --strict networkforgeai
      - run: bandit -q -r networkforgeai -ll
      - run: pip-audit

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime,llm]"
      - run: python -m pytest -q --cov=networkforgeai --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  documentation:
    name: Documentation audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/ci_docs_audit.py --json | tee docs-audit.json
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-audit
          path: docs-audit.json

  findings-policy:
    name: Findings policy gate
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[runtime]"
      - run: python tools/ci_findings_gate.py tests/fixtures/ci-findings-pass.json --json

  container:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker build --tag networkforgeai:ci .

  package-install:
    name: Clean package install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --outdir dist
      - run: python -m venv "$RUNNER_TEMP/networkforgeai-venv"
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/python" -m pip install --upgrade pip'
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/python" -m pip install dist/*.whl'
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/python" -m pip check'
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --version'
        working-directory: ${{ runner.temp }}
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --help'
        working-directory: ${{ runner.temp }}
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --list-tools'
        working-directory: ${{ runner.temp }}
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --validate-config'
        working-directory: ${{ runner.temp }}
        env:
          TARGET_SCOPE: example.com
          DASHBOARD_AUTH_TOKEN: package-smoke-token
      - run: '"$RUNNER_TEMP/networkforgeai-venv/bin/networkforgeai" --target example.com --scope example.com --tool nmap --dry-run'
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        with:
          name: networkforgeai-wheel
          path: dist/*.whl

  readiness:
    name: User readiness gate
    needs: [quality, tests, documentation, container, package-install, findings-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime,llm]"
      - run: python -m pip check
      - run: python tools/user_readiness.py --strict --json | tee user-readiness.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: user-readiness
          path: user-readiness.json
