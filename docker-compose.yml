version: '3.8'

services:
  networkforgeai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: networkforgeai-sandbox
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LITELLM_MODEL=${LITELLM_MODEL:-openai/gpt-4}
      - TARGET_SCOPE=${TARGET_SCOPE:-}
      - APPROVAL_MODE=${APPROVAL_MODE:-strict}
    volumes:
      - ./workspaces:/app/workspaces
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - pentest-net
    # Security: No privileged access, read-only root filesystem option
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    # Health check for sandbox availability
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8081)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build:
      context: ./interface
      dockerfile: Dockerfile.dashboard
    container_name: networkforgeai-dashboard
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      - NETWORKFORGE_HOST=networkforgeai
      - NETWORKFORGE_PORT=8081
      - AUTH_TOKEN=${DASHBOARD_AUTH_TOKEN:-changeme}
    volumes:
      - ./reports:/app/reports:ro
      - ./logs:/app/logs:ro
    networks:
      - pentest-net
    depends_on:
      networkforgeai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Local LLM service (uncomment if using local models)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: networkforgeai-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - pentest-net
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # Optional: Caido proxy for HTTP interception
  caido:
    image: caido/caido:latest
    container_name: networkforgeai-caido
    ports:
      - "${CAIDO_WEB_PORT:-8090}:80"
      - "${CAIDO_PROXY_PORT:-8091}:8080"
    environment:
      - CAIDO_LICENSE=${CAIDO_LICENSE:-}
    volumes:
      - ./caido_data:/data
    networks:
      - pentest-net
    profiles:
      - with-proxy

networks:
  pentest-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ollama_data:
